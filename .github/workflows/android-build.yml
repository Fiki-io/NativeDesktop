name: Android NDK & Desktop Engine CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  native-tests:
    name: Run Native Engine Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile and Run Native Engine Tests
        run: |
          gcc -Wall -Wextra -Iapp/src/main/cpp/shim app/src/main/cpp/shim/desktop_shim.c native_tests/test_shim.c -o native_tests/test_shim -ldl
          ./native_tests/test_shim
          gcc -Wall -Wextra -pthread -Iapp/src/main/cpp/compositor app/src/main/cpp/compositor/wayland_server.c native_tests/test_wayland.c -o native_tests/test_wayland
          ./native_tests/test_wayland

  android-build:
    name: Build Android APK
    needs: native-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Install NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NativeDesktop-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
